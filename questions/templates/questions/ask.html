{% extends "base.html" %}
{% load static %}

{% block title %}Ask a Question — AskIt{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8 col-md-12">
    <div class="card">
      <div class="card-body">
        <h3 class="mb-4">Ask a Question</h3>
        <form method="post" action="#">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Title</label>
            <input type="text" name="title" class="form-control" placeholder="What is your question?" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="text" class="form-control" rows="6" placeholder="Describe your problem in detail..." required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Tags</label>
            <input type="text" name="tags" class="form-control" placeholder="e.g. python, django, css">
            <div class="form-text">Separate tags with commas.</div>
          </div>
          <button type="submit" class="btn btn-success">Post Question</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-4 col-md-12">
    {% include "includes/sidebar.html" %}
  </div>
</div>
{% endblock %}
