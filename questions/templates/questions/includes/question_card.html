{% load static %}
<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between">
      <h5 class="card-title">
        <a href="{% url 'question' question.id %}" class="text-dark text-decoration-none">
          {{ question.title }}
        </a>
      </h5>
      <span class="text-muted small">{{ question.votes }} votes</span>
    </div>
    <p class="card-text text-muted">{{ question.text|truncatewords:20 }}</p>
    <div class="d-flex justify-content-between align-items-center">
      <div>
        {% for tag in question.tags %}
          <a href="{% url 'tag' tag %}" class="badge text-decoration-none me-1">#{{ tag }}</a>
        {% endfor %}
      </div>
      <small class="text-muted">
        by <strong>{{ question.author }}</strong> &bull; {{ question.answers_count }} answers
      </small>
    </div>
  </div>
</div>
