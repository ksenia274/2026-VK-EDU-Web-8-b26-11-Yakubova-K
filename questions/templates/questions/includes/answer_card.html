<div class="card mb-3 {% if answer.is_correct %}border-success{% endif %}">
  <div class="card-body">
    {% if answer.is_correct %}
      <span class="badge bg-success mb-2">Correct Answer</span>
    {% endif %}
    <p class="mb-1">{{ answer.text }}</p>
    <small class="text-muted">
      by <strong>{{ answer.author }}</strong> &bull; {{ answer.votes }} votes
    </small>
  </div>
</div>
