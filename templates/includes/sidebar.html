{% load static %}
<aside class="sidebar p-3 mb-4">
  <h5>Популярные теги</h5>
  <div class="mb-3">
    {% for tag in tags %}
      <a href="{% url 'tag' tag.name %}" class="badge text-decoration-none mb-1">{{ tag.name }}</a>
    {% empty %}
      <p class="text-muted small">Теги пока отсутствуют.</p>
    {% endfor %}
  </div>
  <h5>Лучшие участники</h5>
  {% for member in best_members %}
    <div class="py-1 fw-semibold">{{ member.username }}</div>
  {% empty %}
    <p class="text-muted small">Пока нет участников.</p>
  {% endfor %}
</aside>
