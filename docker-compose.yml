services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: askit
      POSTGRES_USER: askit
      POSTGRES_PASSWORD: askit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env.docker
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
