{% extends "base.html" %}
{% load static %}

{% block title %}Profile — AskIt{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="mb-4 text-center">Edit Profile</h3>
        <div class="text-center mb-4">
          {% if user.avatar %}
            <img src="{{ user.avatar.url }}" class="avatar mb-2" alt="Avatar">
          {% else %}
            <img src="{% static 'img/avatar.png' %}" class="avatar mb-2" alt="Avatar">
          {% endif %}
          <h5 class="mb-0">{{ user.username }}</h5>
          <small class="text-muted">{{ user.email }}</small>
        </div>
        <form method="post" enctype="multipart/form-data" action="#">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" value="{{ user.username }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Avatar</label>
            <input type="file" name="avatar" class="form-control" accept="image/*">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
