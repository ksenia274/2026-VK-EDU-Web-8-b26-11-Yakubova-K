{% extends "base.html" %}
{% load static %}

{% block title %}Вход — AskIt{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="mb-4 text-center">Вход</h3>
        <form method="post" action="#">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Имя пользователя</label>
            <input type="text" name="username" class="form-control" placeholder="Ваш логин" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Пароль</label>
            <input type="password" name="password" class="form-control" placeholder="Ваш пароль" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Войти</button>
          </div>
        </form>
        <p class="text-center mt-3 mb-0">
          Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
