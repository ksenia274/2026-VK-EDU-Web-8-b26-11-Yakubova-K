{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация — AskIt{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="mb-4 text-center">Регистрация</h3>
        <form method="post" action="#">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Имя пользователя</label>
            <input type="text" name="username" class="form-control" placeholder="Придумайте логин" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Ваш email" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Аватар</label>
            <input type="file" name="avatar" class="form-control" accept="image/*">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Пароль</label>
            <input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Повторите пароль</label>
            <input type="password" name="password2" class="form-control" placeholder="Повторите пароль" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
          </div>
        </form>
        <p class="text-center mt-3 mb-0">
          Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
